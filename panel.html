<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFEAF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Панель — Во что сыграем?</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}html{background:#FFE9F0}
:root{--ink:#4A1236;--rose:#C2185B;--deep:#8E0F45;--mute:#7A4260;--card:rgba(255,255,255,.88)}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}body{min-height:100dvh;font:500 16px/1.45 Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#FFEAF1,#FFC9DC 55%,#F8A9C9) fixed}
main{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
a.back{display:inline-block;margin-bottom:8px;color:var(--deep);font-weight:700;text-decoration:none;font-size:14px}
h1{font-size:28px;font-weight:800;color:var(--deep);margin-bottom:2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
h2{margin:22px 0 8px;font-size:15px;font-weight:800;color:var(--deep);text-transform:uppercase;letter-spacing:.04em}
.card{padding:16px;border-radius:20px;background:var(--card)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{padding:14px;border-radius:18px;background:var(--card)}
.k b{display:block;font-size:34px;line-height:1.05;font-weight:800;color:var(--deep)}
.k span{font-size:13px;color:var(--mute)}
.k.wide{grid-column:1/-1}
.fun{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:124px 1fr 76px;gap:8px;align-items:center;font-size:14px}
.bar{height:16px;border-radius:99px;background:#F7D3E0;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--rose)}
.fr b{text-align:right;font-weight:800}
.pc{margin-top:8px;font-size:14px;color:var(--mute)}.pc b{color:var(--deep)}
.days{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px}
.d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.d i{width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:var(--rose)}
.d u{margin-bottom:3px;text-decoration:none;font-weight:700;color:var(--deep);font-size:11px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.hd .sub{margin:0}.rf{flex:none;padding:9px 14px;border:0;border-radius:999px;background:#fff;color:var(--deep);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(142,15,69,.15)}.rf:disabled{opacity:.6}
.note{margin-top:20px;font-size:12px;color:var(--mute)}
.pane{display:flex;flex-direction:column;gap:14px}.pane .card{padding:20px;display:flex;flex-direction:column;gap:12px}.pane>.note{margin:0}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:16px;background:var(--card)}.tabs button{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--deep);font:700 15px Manrope,system-ui,sans-serif;cursor:pointer}.tabs button.on{background:var(--rose);color:#fff;font-weight:800}
.ct{font-size:18px;font-weight:800;color:var(--deep)}.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .lb{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mute)}.hero .big{display:flex;align-items:baseline;gap:8px}.hero .big b{font-size:56px;line-height:1;font-weight:800;color:var(--deep)}.hero .big span{font-size:20px;font-weight:700}.hero .sm{display:flex;gap:20px;font-size:15px}
.ok{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#DDF3E4;color:#14532D;font-size:13px;font-weight:700}
.sg{display:flex;gap:2px;padding:2px;border-radius:12px;background:#F7D3E0}.sg button{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--deep);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer}.sg button.on{background:var(--rose);color:#fff;font-weight:800}
.fr span{min-width:0;overflow-wrap:anywhere;font-weight:700}.fr small,.rw small{font-size:13px;font-weight:500;color:var(--mute)}
.fr2{display:grid;gap:6px;font-size:15px}.rw{display:flex;justify-content:space-between;gap:8px}.rw span{font-weight:700}.rw b{font-weight:800}
.say{margin:0;padding:12px 14px;border-radius:14px;background:#FFE3EE;font-size:14px;line-height:1.45}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{min-height:44px;padding:0 10px;border:1.5px solid var(--rose);border-radius:12px;background:#fff;color:var(--rose);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer}
.d i.now{background:var(--deep)}.d span.td{font-weight:800;color:var(--deep)}.d span{font-size:12px}.d u{font-size:12px}
details.more{border-radius:22px;background:var(--card)}details.more summary{min-height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-weight:800;color:var(--deep);cursor:pointer;list-style:none}details.more summary::-webkit-details-marker{display:none}details.more[open] summary svg{transform:rotate(180deg)}details.more .inner{padding:0 20px 20px}
.pc{margin-top:0}
.cl{padding:12px 0;border-top:1px solid #F0C9D8}.cl:first-of-type{border-top:0}
.cl .u{display:flex;gap:8px;margin:6px 0}
.card .cl .u input{flex:1;min-width:0;width:auto;margin:0;padding:10px;font:500 14px Manrope,system-ui,sans-serif;border:1.5px solid #E8B7CB;border-radius:12px;background:#fff;color:var(--ink)}
.cl .u button,.rs{flex:none;padding:0 14px;min-height:44px;border:1.5px solid var(--rose);border-radius:12px;background:#fff;color:var(--rose);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.cl .u button.del{border-color:#b00020;color:#b00020}
.rs{width:100%;margin-top:10px}
.cn{display:flex;gap:8px;margin-top:10px}.card .cn input{flex:1;min-width:0;width:auto;margin:0}.cn button{flex:none;padding:0 16px;min-height:46px;border:0;border-radius:12px;background:var(--rose);color:#fff;font:800 15px Manrope,system-ui,sans-serif;cursor:pointer}
button.go{width:100%;padding:15px;border:0;border-radius:16px;background:var(--rose);color:#fff;font:800 17px Manrope,system-ui,sans-serif;cursor:pointer;margin-top:10px}
.seg{display:grid;gap:6px;margin-bottom:10px}.seg label,.chk label{display:flex;gap:8px;align-items:center;font-size:15px}
.card input[type=text],.card input[type=url],.card input:not([type]),.card input[type=date]{width:100%;margin:6px 0;padding:11px 12px;border:1.5px solid #E8B7CB;border-radius:12px;font:500 16px Manrope,system-ui,sans-serif;color:var(--ink);background:#fff}
.card input[type=file]{display:block;width:100%;margin:6px 0 10px;font-size:14px}.fl{display:block;font-size:14px;font-weight:700}.card input[type=file]{font-size:16px}.fl small{font-weight:500;color:var(--mute)}
.chk{display:grid;gap:6px;margin:8px 0}.dts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:14px}.dts label{min-width:0;display:block}.dts input{font-size:16px;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px}.pv[hidden]{display:none}
.pv{margin:12px 0;padding:10px;border-radius:14px;background:#FFE3EE;display:grid;gap:8px}.pv small{color:var(--mute)}
.ar{margin-bottom:12px}.ar .st{margin:8px 0 2px;font-size:14px;color:var(--mute)}.ar .st b{color:var(--deep)}
.ab{display:flex;gap:8px;margin-top:8px}.ab button{flex:1;padding:10px;border:1.5px solid var(--rose);border-radius:12px;background:#fff;color:var(--rose);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}.ab button.d{color:#b00020;border-color:#b00020}
.off{opacity:.55}
.msg{padding:18px;border-radius:20px;background:var(--card);text-align:center}
.msg p{margin-top:6px;color:var(--mute);font-size:14px}
</style>

<body>
<main>
<a class="back" href="index.html">← На сайт</a>
<h1>Панель владельца</h1>
<div class="hd"><p class="sub" id="sub">Сколько людей играет и во что</p><button type="button" class="rf" id="rf" hidden>↻ Обновить</button></div>
<div id="tabs" class="tabs" role="tablist" hidden><button type="button" role="tab" data-t="main" aria-selected="true" class="on">Главное</button><button type="button" role="tab" data-t="games" aria-selected="false">Игры</button><button type="button" role="tab" data-t="ads" aria-selected="false">Реклама</button></div>
<div id="out" class="pane"><div class="msg">Загружаем…</div></div>
<div id="p-games" class="pane" hidden></div>
<div id="p-ads" class="pane" hidden><div id="links"></div><div id="adm"></div></div>
<p class="note" id="ver"></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="version.js"></script><script src="version-check.js"></script>
<script src="profile.js"></script>
<script src="ads.js"></script>
<script>
const $ = s => document.querySelector(s), out = $('#out');
const GAMES = { paint: 'Холст', word: 'Угадай слово', number: 'Угадай число', egg: 'Не урони яйцо', chips: 'Чипсы-сюрприз', tictactoe: 'Крестики-нолики', memory: 'Найди пару', questions: 'Вопросы друг другу', monster: 'Создай монстра' , seabattle: 'Морской бой', truth: 'Правда или действие' };
const ymd = d => d.toISOString().slice(0, 10);
const days = n => Array.from({ length: n }, (_, i) => ymd(new Date(Date.now() - (n - 1 - i) * 864e5)));
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const fmt = n => new Intl.NumberFormat('ru-RU').format(n || 0);

function login(msg) {
  out.innerHTML = `<div class="msg"><b>${msg}</b><p>Войдите через Google той же почтой, которая указана в правилах базы.</p><button class="go" id="g">Войти через Google</button><p id="err"></p></div>`;
  $('#g').onclick = async () => {
    try { await Profile.linkGoogle(); location.reload(); } catch (e) { $('#err').textContent = Profile.authError(e); }
  };
}

let RAW = {}, TOT = 0;
const getLinks = () => { try { return JSON.parse(localStorage.getItem('kh_links') || '[]').filter(s => /^[a-z0-9][a-z0-9_-]{1,23}$/.test(s)); } catch (e) { return []; } };
const setLinks = L => { try { localStorage.setItem('kh_links', JSON.stringify(L)); } catch (e) {} };
const TR = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya', і: 'i', ї: 'yi', є: 'ye', ґ: 'g' };
const mkSlug = s => { let r = String(s || '').toLowerCase().split('').map(c => TR[c] !== undefined ? TR[c] : c).join('').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24).replace(/-+$/, ''); if (/^(ig|th|tt|tg)$/.test(r)) r += '-ad'; return r.length >= 2 ? r : ''; };
const getBase = () => { try { return JSON.parse(localStorage.getItem('kh_base') || '{}'); } catch (e) { return {}; } };
function adjust(daily) { const base = getBase(), r = {}; for (const d in daily) { r[d] = Object.assign({}, daily[d]); const b = base[d]; if (b) for (const k in b) if (r[d][k] != null) r[d][k] = Math.max(0, r[d][k] - b[k]); } return r; }
function resetCounters() {
  const base = {}; for (const d in RAW) for (const k in RAW[d]) if (typeof RAW[d][k] === 'number') (base[d] = base[d] || {})[k] = RAW[d][k];
  try { localStorage.setItem('kh_base', JSON.stringify(base)); localStorage.setItem('kh_base_tot', String(TOT)); localStorage.setItem('kh_base_t', String(Date.now())); } catch (e) {}
  render(RAW, TOT);
}

let SRC_RANGE = 'week', SHOW_ALL = false, TAB = 'main';
try { TAB = localStorage.getItem('kh_tab') || 'main'; } catch (e) {}
function showTab(t) {
  if (!['main', 'games', 'ads'].includes(t)) t = 'main';
  TAB = t; try { localStorage.setItem('kh_tab', t); } catch (e) {}
  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
  $('#out').hidden = t !== 'main'; $('#p-games').hidden = t !== 'games'; $('#p-ads').hidden = t !== 'ads';
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.t));

function render(daily, total) {
  daily = adjust(daily);
  const D = k => d => ((daily[d] || {})[k]) || 0;
  const sum = (k, ds) => ds.reduce((a, d) => a + D(k)(d), 0);
  const d30 = days(30), d7 = days(7), today = ymd(new Date()), yest = ymd(new Date(Date.now() - 864e5));
  const rooms = sum('room_created', d30), joined = sum('partner_joined', d30), done = sum('game_complete', d30);
  const gk = Object.keys(GAMES).map(g => ({ g, open: sum('open_' + g, d30), done: sum('done_' + g, d30) })).sort((a, b) => b.open - a.open);
  const maxG = Math.max(1, ...gk.map(x => x.open));
  const seen = new Set(); for (const d in daily) for (const k in daily[d]) if (k.startsWith('v_c_') && daily[d][k] > 0 && /^[a-z0-9][a-z0-9_-]{1,23}$/.test(k.slice(4))) seen.add(k.slice(4));
  const local = getLinks(), camp = [...new Set([...local, ...seen])];
  const SRC = [['ig', 'Instagram'], ['tt', 'TikTok'], ['th', 'Threads'], ['google', 'Google'], ['search', 'Другие поисковики'], ['tg', 'Telegram'], ['vk', 'ВКонтакте'], ['fb', 'Facebook'], ['other', 'Другие сайты'], ['direct', 'Напрямую']];
  const me = (() => { try { return localStorage.getItem('kh_me') === '1' || localStorage.getItem('kh_owner') === '1'; } catch (e) { return false; } })();

  /* Главное */
  const ds = SRC_RANGE === 'today' ? [today] : d7;
  const rows = SRC.map(([k, n]) => ({ n, v: sum('v_' + k, ds) })).concat(camp.map(c => ({ n: 'Реклама: ' + c, v: sum('v_c_' + c, ds) }))).filter(x => x.v).sort((a, b) => b.v - a.v);
  const tot = rows.reduce((a, x) => a + x.v, 0), mx = Math.max(1, ...rows.map(x => x.v));
  const srcHtml = rows.length ? rows.map(x => `<div class="fr"><span>${x.n}</span><div class="bar"><i style="width:${x.v / mx * 100}%"></i></div><b>${fmt(x.v)} <small>${Math.round(x.v / tot * 100)}%</small></b></div>`).join('') : '<p class="pc">Пока нет данных.</p>';
  const chips = [['ig', 'Instagram'], ['tt', 'TikTok'], ['th', 'Threads'], ['tg', 'Telegram']].map(([k, n]) => `<button type="button" class="chip" data-v="https://twosome.games/${k}" aria-label="Скопировать ссылку для ${n}">twosome.games/${k}</button>`).join('');
  const d7p = d7.map(D('p_all')), maxP = Math.max(1, ...d7p), WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const bars = d7.map((d, i) => `<div class="d"><u>${d7p[i]}</u><i class="${d === today ? 'now' : ''}" style="height:${Math.max(d7p[i] / maxP * 80, 2)}%"></i><span${d === today ? ' class="td"' : ''}>${WD[new Date(d + 'T12:00:00Z').getUTCDay()]}</span></div>`).join('');
  const bt = +(() => { try { return localStorage.getItem('kh_base_t'); } catch (e) { return 0; } })() || 0;
  const resetHtml = `<p class="pc" style="margin:0">${bt ? 'Счётчик сброшен ' + new Date(bt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '. ' : ''}Сброс обнуляет все цифры панели (посетители, источники, комнаты, игры, приглашения) на этом устройстве, считать заново начнёт с нуля.</p><button type="button" class="rs" id="rs">Сбросить все счётчики</button>`;

  $('#out').innerHTML = `<div class="card hero"><span class="lb">СЕГОДНЯ ЗАШЛО</span>
<div class="big"><b>${fmt(D('p_all')(today))}</b><span>человек</span></div>
<div class="sm"><span>Вчера: <b>${fmt(D('p_all')(yest))}</b></span><span>За 7 дней: <b>${fmt(sum('p_all', d7))}</b></span></div>
<span class="pc" style="margin:0">Всего открытий сайта сегодня — ${fmt(D('v_all')(today))}. Один человек может зайти несколько раз.</span>
${me ? '<div class="ok">✓ Ваши заходы с этого устройства не считаются</div>' : ''}</div>
<div class="card"><div class="ch"><span class="ct">Откуда пришли</span><div class="sg"><button type="button" data-r="today" class="${SRC_RANGE === 'today' ? 'on' : ''}">Сегодня</button><button type="button" data-r="week" class="${SRC_RANGE === 'week' ? 'on' : ''}">7 дней</button></div></div>
<div class="fun">${srcHtml}</div>
<p class="pc" style="margin:0">«Напрямую» — ссылка открылась без пометки. Так часто выглядят переходы из приложений Instagram и TikTok. Чтобы видеть точнее, ставьте в профили короткие ссылки:</p>
<div class="chips">${chips}</div></div>
<div class="card"><span class="ct">Люди по дням</span><div class="days">${bars}</div><p class="pc" style="margin:0">В среднем в день за неделю: <b>${(sum('p_all', d7) / 7).toFixed(1)}</b>. Дни по времени UTC.</p></div>
<details class="more"><summary>Ещё цифры: статистика Google, приглашения<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="inner">
<p class="pc">Сегодня, только те, кто нажал «Принять» на баннере статистики:</p><div class="grid">
<div class="k"><b>${fmt(D('users')(today))}</b><span>человек заходило</span></div>
<div class="k"><b>${fmt(D('newusers')(today))}</b><span>из них новых</span></div>
<div class="k"><b>${fmt(D('room_created')(today))}</b><span>комнат создано</span></div>
<div class="k"><b>${fmt(D('game_complete')(today))}</b><span>партий доиграно</span></div>
<div class="k wide"><b>${fmt(Math.max(0, total - (+(() => { try { return localStorage.getItem('kh_base_tot'); } catch (e) { return 0; } })() || 0)))}</b><span>всего разных людей с начала подсчёта</span></div></div>
<p class="pc">За 30 дней:</p><div class="grid">
<div class="k"><b>${fmt(sum('invite_sent', d30))}</b><span>приглашений другу</span></div>
<div class="k"><b>${fmt(sum('friend_added', d30))}</b><span>подружились</span></div>
<div class="k"><b>${fmt(sum('profile_saved', d30))}</b><span>сохранили профиль</span></div>
<div class="k"><b>${fmt(sum('views', d30))}</b><span>открытий страниц</span></div></div>
<p class="note">Время на сайте, устройства и источники рекламы смотрите в Google Analytics.</p></div></details>
<div class="card">${resetHtml}</div>`;

  /* Игры */
  const shown = SHOW_ALL ? gk : gk.slice(0, 5);
  const doneList = gk.filter(x => x.done).map(x => `${GAMES[x.g]} <b>${x.done}</b>`).join(', ') || 'пока нет';
  $('#p-games').innerHTML = `<div class="card"><span class="ct">Дошли ли до игры вдвоём</span><span class="pc" style="margin:0">За 30 дней</span>
<div class="fun">
<div class="fr2"><div class="rw"><span>Создали комнату</span><b>${fmt(rooms)}</b></div><div class="bar"><i style="width:100%"></i></div></div>
<div class="fr2"><div class="rw"><span>Второй игрок зашёл</span><b>${fmt(joined)} <small>${pct(joined, rooms)}</small></b></div><div class="bar"><i style="width:${rooms ? Math.min(100, joined / rooms * 100) : 0}%"></i></div></div>
<div class="fr2"><div class="rw"><span>Партию доиграли</span><b>${fmt(done)} <small>${pct(done, rooms)}</small></b></div><div class="bar"><i style="width:${rooms ? Math.min(100, done / rooms * 100) : 0}%"></i></div></div></div>
<p class="say">${rooms ? `Из ${fmt(rooms)} комнат до второго игрока дошли <b>${fmt(joined)}</b>. Если эта цифра маленькая, людям сложно позвать второго.` : 'Комнат за 30 дней пока не создавали.'}</p></div>
<div class="card"><span class="ct">Что открывают чаще всего</span><span class="pc" style="margin:0">Сколько раз открывали игру за 30 дней</span>
<div class="fun">${shown.map(x => `<div class="fr"><span>${GAMES[x.g]}</span><div class="bar"><i style="width:${x.open / maxG * 100}%"></i></div><b>${fmt(x.open)}</b></div>`).join('')}</div>
<button type="button" class="rs" id="allg" style="margin-top:0">${SHOW_ALL ? 'Только лучшие 5' : 'Показать все ' + gk.length + ' игр'}</button>
<p class="pc" style="margin:0">Доиграно партий: ${doneList}.</p></div>
<p class="note">Здесь считаются только те, кто нажал «Принять» на баннере статистики.</p>`;

  /* Реклама: ссылки */
  $('#links').innerHTML = `<div class="card"><span class="ct">Рекламные ссылки</span><p class="pc" style="margin:0">Дайте такую ссылку рекламодателю или поставьте в пост: сколько человек перешло, видно здесь.</p>
<div class="cn"><input id="cn" maxlength="40" placeholder="Название (канал Иры)"><button type="button" id="cadd">Создать</button></div><p class="pc" id="cmsg" style="margin:0"></p>` +
    (camp.length ? camp.map(c => `<div class="cl"><b>${c}</b><div class="u"><input readonly value="https://twosome.games/?from=${c}" aria-label="Ссылка"><button type="button" data-copy>Копировать</button>${local.includes(c) && !seen.has(c) ? `<button type="button" class="del" data-del="${c}" aria-label="Убрать ссылку">✕</button>` : ''}</div><span class="pc" style="margin:0">Переходов: сегодня <b>${fmt(sum('v_c_' + c, [today]))}</b> · 7 дней <b>${fmt(sum('v_c_' + c, d7))}</b> · 30 дней <b>${fmt(sum('v_c_' + c, d30))}</b></span></div>`).join('') : '<p class="pc" style="margin:0">Ссылок пока нет.</p>') +
    `<p class="pc" style="margin:0">Считается один переход на посещение. Свои заходы по ссылке не считаются (на устройстве, где вы открывали панель), проверяйте с другого телефона.</p></div>`;

  /* действия */
  const rs = $('#rs'); if (rs) { let sure = false; rs.onclick = () => { if (!sure) { sure = true; rs.textContent = 'Точно сбросить? Нажмите ещё раз'; setTimeout(() => { sure = false; rs.textContent = 'Сбросить все счётчики'; }, 4000); return; } resetCounters(); }; }
  const ca = $('#cadd'); if (ca) ca.onclick = () => {
    const s = mkSlug($('#cn').value); if (!s) { $('#cmsg').textContent = 'Введите название, не меньше двух букв или цифр.'; return; }
    const L = getLinks(); if (!L.includes(s)) { L.push(s); setLinks(L); } render(RAW, TOT);
  };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { SRC_RANGE = b.dataset.r; render(RAW, TOT); });
  const ag = $('#allg'); if (ag) ag.onclick = () => { SHOW_ALL = !SHOW_ALL; render(RAW, TOT); };
  document.querySelectorAll('[data-copy], .chip').forEach(b => b.onclick = async () => {
    const i = b.parentNode.querySelector('input'), val = b.dataset.v || (i && i.value) || '', t0 = b.dataset.t0 || b.textContent; b.dataset.t0 = t0;
    try { await navigator.clipboard.writeText(val); b.textContent = 'Скопировано ✓'; } catch (e) { if (i) i.select(); b.textContent = 'Выделено'; }
    setTimeout(() => { b.textContent = t0; }, 1800);
  });
  document.querySelectorAll('.cl input').forEach(i => i.onclick = () => i.select());
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { setLinks(getLinks().filter(s => s !== b.dataset.del)); render(RAW, TOT); });
  showTab(TAB);
}


function adAdmin() {
  const db = firebase.database(), box = $('#adm'); let imgData = null, imgGame = null, lastGame = null;
  box.innerHTML = `<h2>Баннеры на сайте</h2><div class="card">
<div class="seg"><label><input type="radio" name="t" value="image" checked> Только картинка</label><label><input type="radio" name="t" value="card"> Картинка + заголовок и описание</label></div>
<label class="fl">Картинка <small id="ahint">(лучше 3:1, например 1200×400)</small><input type="file" id="af" accept="image/*"></label>
<label class="fl" id="gwrap">Узкая версия для игр <small>(необязательно, 1200×220)</small><input type="file" id="afg" accept="image/*"></label>
<div id="cardf" hidden><input id="at" maxlength="40" placeholder="Заголовок"><input id="ax" maxlength="90" placeholder="Описание (коротко)"></div>
<input id="au" type="url" inputmode="url" placeholder="Ссылка (https://…)">
<div class="chk"><label><input type="checkbox" id="ph" checked> Главная, после 3-й игры</label><label><input type="checkbox" id="pg" checked> В играх, сверху</label><label><input type="checkbox" id="pe" checked> После партии</label></div>
<div class="dts"><label>Показывать с<input type="date" id="d1"></label><label>по<input type="date" id="d2"></label></div>
<div class="pv" id="apv" hidden></div>
<button class="go" id="aadd">Добавить рекламу</button><p class="pc" id="amsg"></p></div>
<h2>Ваши баннеры</h2><div id="alist"><div class="msg">Загружаем…</div></div>`;
  const type = () => box.querySelector('input[name=t]:checked').value, v = id => $(id).value.trim();
  const fixUrl = u => /^https?:\/\//i.test(u) ? u.replace(/^http:/i, 'https:') : (u ? 'https://' + u : '');
  const cur = () => ({ id: 'pv', type: type(), img: imgData, imgGame, title: v('#at'), text: v('#ax'), url: fixUrl(v('#au')) || 'https://example.com' });
  function preview() {
    const pv = $('#apv'), card = type() === 'card';
    const showMain = !!imgData, showGame = !card && !!imgGame;
    if (!showMain && !showGame) { pv.hidden = true; return; }
    pv.hidden = false; pv.innerHTML = (showMain ? '<small>Так будет на главной и после партии</small><div id="p1"></div>' : '') + (showGame ? '<small>Так будет в играх сверху</small><div id="p2"></div>' : '');
    if (showMain) $('#p1').appendChild(Ads.render(cur(), 'home', { preview: true }));
    if (showGame) $('#p2').appendChild(Ads.render(card ? cur() : { ...cur(), img: imgGame }, 'game', { preview: true }));
  }
  const proc = (file, t) => new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const [W, H] = t === 'card' ? [200, 200] : t === 'game' ? [900, 164] : [900, 300], c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      const r = Math.max(W / im.width, H / im.height), w = im.width * r, h = im.height * r; x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u);
      let q = .85, d = c.toDataURL('image/jpeg', q); while (d.length > 110000 && q > .4) { q -= .1; d = c.toDataURL('image/jpeg', q); } res(d);
    };
    im.onerror = () => rej(new Error('Не удалось открыть картинку')); im.src = u;
  });
  let lastFile = null;
  async function reimg() { if (!lastFile) return; try { imgData = await proc(lastFile, type()); } catch (e) { imgData = null; $('#amsg').textContent = e.message; } preview(); }
  box.querySelectorAll('input[name=t]').forEach(r => r.onchange = () => { $('#cardf').hidden = type() !== 'card'; $('#gwrap').hidden = type() === 'card'; $('#ahint').textContent = type() === 'card' ? '(квадратная миниатюра)' : '(лучше 3:1, например 1200×400)'; reimg(); });
  $('#af').onchange = e => { lastFile = e.target.files[0] || null; reimg(); };
  $('#afg').onchange = async e => { lastGame = e.target.files[0] || null; imgGame = null; if (lastGame) { try { imgGame = await proc(lastGame, 'game'); } catch (x) { $('#amsg').textContent = x.message; } } preview(); };
  ['#at', '#ax', '#au'].forEach(i => $(i).oninput = preview);
  $('#aadd').onclick = async () => {
    const m = $('#amsg'), t = type(), url = fixUrl(v('#au'));
    const only = $('#pg').checked && !$('#ph').checked && !$('#pe').checked;
    if (!imgData && t === 'image' && imgGame && only) imgData = imgGame;
    if (!imgData) return m.textContent = t === 'image' && imgGame ? 'Для главной и конца партии нужна основная картинка (1200×400). Или оставьте только «В играх, сверху».' : 'Выберите картинку.';
    if (!/^https:\/\/[^\s.]+\.[^\s]+/.test(url)) return m.textContent = 'Укажите ссылку, куда ведёт реклама.';
    if (t === 'card' && !v('#at')) return m.textContent = 'Для варианта с текстом нужен заголовок.';
    const places = {}; if ($('#ph').checked) places.home = true; if ($('#pg').checked) places.game = true; if ($('#pe').checked) places.end = true;
    if (!Object.keys(places).length) return m.textContent = 'Выберите, где показывать.';
    const rec = { type: t, img: imgData, url, places, on: true, t: firebase.database.ServerValue.TIMESTAMP };
    if (t === 'card') { rec.title = v('#at'); if (v('#ax')) rec.text = v('#ax'); } else if (imgGame) rec.imgGame = imgGame;
    if ($('#d1').value) rec.from = $('#d1').value; if ($('#d2').value) rec.to = $('#d2').value;
    try { await db.ref('ads').push(rec); m.textContent = 'Добавлено ✓'; imgData = null; lastFile = null; imgGame = null; lastGame = null; $('#af').value = ''; $('#afg').value = ''; ['#at', '#ax', '#au', '#d1', '#d2'].forEach(i => $(i).value = ''); preview(); list(); }
    catch (e) { m.textContent = 'Не сохранилось: проверьте правила базы (блок ads) и вход той же почтой.'; }
  };
  async function list() {
    const L = $('#alist');
    try {
      const [a, s] = await Promise.all([db.ref('ads').once('value'), db.ref('stats/ads').once('value').catch(() => null)]);
      const ads = a.val() || {}, st = (s && s.val()) || {}, ids = Object.keys(ads).sort((x, y) => (ads[y].t || 0) - (ads[x].t || 0));
      if (!ids.length) { L.innerHTML = '<div class="msg">Пока нет баннеров.</div>'; return; }
      L.innerHTML = ''; const names = { home: 'главная', game: 'игры сверху', end: 'после партии' };
      ids.forEach(id => {
        const ad = Object.assign({ id }, ads[id]), imp = (st[id] || {}).imp || 0, clk = (st[id] || {}).clk || 0;
        const row = document.createElement('div'); row.className = 'card ar' + (ad.on ? '' : ' off');
        row.appendChild(Ads.render(ad, 'home', { preview: true }));
        const info = document.createElement('div'); info.className = 'st';
        info.innerHTML = `Места: <b>${Object.keys(ad.places || {}).map(k => names[k]).join(', ') || '—'}</b>${ad.imgGame ? ' · есть версия для игр' : ''}${ad.from || ad.to ? ` · ${ad.from || '…'} — ${ad.to || '…'}` : ''}<br>Показов: <b>${imp}</b> · Кликов: <b>${clk}</b> · Клики: <b>${imp ? (clk / imp * 100).toFixed(1) + '%' : '—'}</b>${ad.on ? '' : ' · <b>выключен</b>'}`;
        const bar = document.createElement('div'); bar.className = 'ab';
        const tg = document.createElement('button'); tg.textContent = ad.on ? 'Выключить' : 'Включить'; tg.onclick = () => db.ref('ads/' + id + '/on').set(!ad.on).then(list);
        const dl = document.createElement('button'); dl.className = 'd'; dl.textContent = 'Удалить'; let sure = false;
        dl.onclick = () => { if (!sure) { sure = true; dl.textContent = 'Точно удалить?'; return; } db.ref('ads/' + id).remove().then(list); };
        bar.append(tg, dl); row.append(info, bar); L.appendChild(row);
      });
    } catch (e) { L.innerHTML = '<div class="msg">Не удалось загрузить: обновите правила базы (блок ads).</div>'; }
  }
  list();
}

(async () => {
  const uid = await Profile.init();
  if (!uid) { out.innerHTML = '<div class="msg"><b>Нет связи с базой</b><p>Проверьте интернет и настройки Firebase.</p></div>'; return; }
  if (!Profile.isLinked()) return login('Нужен вход');
  const rf = $('#rf'); let first = true; Ver.mount($('#ver'));
  async function load() {
    const db = firebase.database();
    await firebase.auth().currentUser.getIdToken(true);
    const [daily, total] = await Promise.all([db.ref('stats/daily').once('value'), db.ref('stats/total/users').once('value')]);
    RAW = daily.val() || {}; TOT = total.val() || 0; render(RAW, TOT);
    if (first) { first = false; adAdmin(); }
    const t = new Date(); $('#sub').textContent = 'Обновлено в ' + t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  rf.onclick = async () => {
    rf.disabled = true; rf.textContent = '↻ Обновляем…';
    try { await load(); rf.textContent = '✓ Готово'; } catch (e) { rf.textContent = '⚠ Ошибка'; }
    setTimeout(() => { rf.disabled = false; rf.textContent = '↻ Обновить'; }, 1200);
  };
  try { await load(); rf.hidden = false; $('#tabs').hidden = false; try { localStorage.setItem('kh_owner', '1'); } catch (e) {} } catch (e) { login('Нет доступа'); }
})();
</script>
