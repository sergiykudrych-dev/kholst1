<style>
:root{--ink:#4A1236;--rose:#C2185B;--deep:#8E0F45;--mute:#8A5570}
*{box-sizing:border-box;margin:0}
body{display:flex;flex-direction:column;min-height:100dvh;font:500 16px/1.4 Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#FFEAF1,#FFC9DC 55%,#F8A9C9) fixed;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px;max-width:520px;width:100%;margin:0 auto}
.chip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-weight:700;font-size:14px;color:var(--deep);text-decoration:none}
#view{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px;margin:0 auto;padding:0 10px max(12px,env(safe-area-inset-bottom))}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;width:100%;text-align:center}
h1{font:400 clamp(34px,10vw,48px)/1.1 'Marck Script',cursive;color:var(--deep)}
.pick{display:grid;gap:12px;width:100%}
.pick button{padding:20px;border-radius:24px;background:rgba(255,255,255,.82);box-shadow:0 14px 34px -18px rgba(142,15,69,.6);font-size:22px;font-weight:700}
.pick small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.beat{font-size:64px;color:var(--rose);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.who,.hint{color:var(--mute);font-size:14px}
.disp{display:grid;place-items:center;min-height:78px;font:700 clamp(52px,16vw,72px)/1 Manrope,sans-serif;color:var(--deep);letter-spacing:2px}
.disp.empty{color:rgba(142,15,69,.25)}
.range{width:100%;text-align:center;padding-top:6px}
.bar{position:relative;height:10px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--rose)}
.hist{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.try{display:flex;gap:12px;align-items:center;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.82);font-weight:700;color:var(--deep)}
.try span{font-weight:500;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.pad button{height:54px;border-radius:14px;background:rgba(255,255,255,.9);color:var(--deep);font-weight:700;font-size:24px;box-shadow:0 2px 0 rgba(142,15,69,.2)}
.start,.again{width:100%;max-width:340px;padding:15px;border-radius:16px;background:var(--rose);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.start:disabled{opacity:.4;cursor:default}
.over{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(74,18,54,.45);backdrop-filter:blur(3px)}
.card{width:100%;max-width:400px;padding:28px 22px 22px;border-radius:28px;background:#FFF8FA;text-align:center;box-shadow:0 30px 70px -20px rgba(74,18,54,.6)}
.card h2{font:400 42px/1.1 'Marck Script',cursive;color:var(--deep)}
.big{margin:10px 0 14px;font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);word-break:break-word}
.card a{display:inline-block;margin-top:12px;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.beat{animation:none}}
.cols{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;min-height:0}
.col h3{font-size:13px;color:var(--mute);font-weight:700}
.col .try{width:100%;justify-content:space-between;padding:6px 14px;font-size:15px}
.turn{font-weight:700;color:var(--deep);text-align:center}
.mine{margin:6px auto 0;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;color:var(--mute)}
.pad button:disabled{opacity:.4;cursor:default}
html,body,button,input,a{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#view,.mid{min-height:0}
.range,.mine,.disp,.pad,.start{flex-shrink:0}
.cols{grid-template-rows:minmax(0,1fr);min-height:72px}
.disp{min-height:clamp(48px,9dvh,78px);font-size:clamp(40px,8dvh,72px)}
.pad button{height:clamp(42px,6.5dvh,54px)}
.start{margin-top:8px}
#sceneBox{width:100%;height:min(40vh,calc((min(100vw,520px) - 20px)*.867));height:min(40dvh,calc((min(100vw,520px) - 20px)*.867));flex-shrink:0;margin-top:2px}
#sceneBox[hidden]{display:none}
#scene{display:block;width:100%;height:100%}
.die .q{grid-area:1/1/4/4;display:grid;place-items:center;font:700 44px Manrope,sans-serif;color:#E7B1C6}
#ui{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
textarea{width:100%;padding:12px 14px;border:1.5px solid #F3B6CC;border-radius:14px;background:#fff;font:600 16px Manrope,sans-serif;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--deep);font-size:13px;font-weight:700}
.dierow{display:flex;align-items:center;gap:14px;justify-content:center;min-height:96px}
.die{width:84px;height:84px;padding:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);border-radius:20px;background:#fff;box-shadow:0 8px 20px -10px rgba(142,15,69,.6),0 3px 0 rgba(142,15,69,.2)}
.die i{display:block}.die i.p{margin:2px;border-radius:50%;background:var(--rose)}
.die.roll{animation:roll .6s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}60%{transform:rotate(25deg) scale(1.1)}100%{transform:none}}
.turn{font-weight:700;color:var(--deep);font-size:18px}
.task{margin:10px 0 16px;font-weight:700;font-size:22px;color:var(--deep);word-break:break-word}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;flex-shrink:0}
.fields h3{margin-bottom:6px;text-align:center;font-size:13px;color:var(--mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;border-radius:20px;background:rgba(255,255,255,.55)}
.grid.big{width:100%;max-width:320px;gap:8px;padding:14px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:14px}
button.cell:disabled{cursor:default}
.cell .c{width:82%;height:64%;border-radius:55% 45% 60% 40%/60% 50% 50% 40%;background:radial-gradient(ellipse at 35% 30%,#FFF1BE,#F6C453 70%,#E3A62C);box-shadow:0 3px 0 rgba(160,110,20,.35);transform:rotate(-12deg);transition:transform .15s}
.cell:nth-child(3n+2) .c{transform:rotate(8deg)}.cell:nth-child(3n) .c{transform:rotate(-30deg)}
button.cell:not(:disabled):active .c{transform:scale(.88)}
.cell.sel{background:rgba(194,24,91,.16);box-shadow:inset 0 0 0 2px var(--rose)}
.cell .b{position:absolute;top:0;right:2px;font-size:15px}
.cell .em{font-size:clamp(24px,8vw,34px)}
.cell .dot{width:10px;height:10px;border-radius:50%;background:rgba(142,15,69,.2)}
.big2{font-size:64px;line-height:1.1}
.task{margin:10px 0 16px;font-weight:700;font-size:22px;color:var(--deep);word-break:break-word}
.mturn{font-weight:700;color:var(--deep);text-align:center;font-size:18px;flex-shrink:0}
.stage{display:block;width:100%;height:min(36dvh,300px);flex-shrink:0}
.stage.bob{animation:bob 2.6s ease-in-out infinite}
.stage.hop{animation:hop .55s ease-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
@keyframes hop{0%{transform:scale(.9)}50%{transform:scale(1.07)}100%{transform:none}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;flex-shrink:0}
.opt{aspect-ratio:1.1;padding:4px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 8px 18px -12px rgba(142,15,69,.7),0 3px 0 rgba(142,15,69,.18)}
.opt:not(:disabled):active{transform:scale(.94)}
.opt:disabled{opacity:.55;cursor:default}
.opt svg{display:block;width:100%;height:100%}
.steps{display:flex;gap:6px;justify-content:center;flex-shrink:0}
.steps i{width:10px;height:10px;border-radius:50%;background:rgba(142,15,69,.2)}
.steps i.on{background:var(--rose)}.steps i.now{background:var(--rose);transform:scale(1.35)}
.over{animation:fade .4s both}@keyframes fade{from{opacity:0}to{opacity:1}}
.save{width:100%;max-width:340px;padding:13px;border-radius:16px;background:#fff;color:var(--rose);border:2px solid var(--rose);font-weight:700;font-size:16px;margin-top:8px}
.mname{font:400 40px/1.1 'Marck Script',cursive;color:var(--deep);margin:2px 0 6px}
@media(prefers-reduced-motion:reduce){.stage.bob,.stage.hop,.over{animation:none}}
</style>
</head>
<body>
<header>
  <a class="chip" href="index.html">← Игры</a>
  <span class="chip" id="me"></span>
  <button class="chip" id="inv">Пригласить</button>
</header>
<div id="view"><div id="ui"></div></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
document.addEventListener('gesturestart', e => e.preventDefault());
const $ = s => document.querySelector(s), view = $('#view'), ui = $('#ui');
const room = (location.hash.match(/room=([\w-]+)/) || [])[1];
if (!room) location.replace('index.html');
const me = /host=1/.test(location.hash) ? 1 : 2, other = 3 - me;
$('#me').textContent = 'Вы — Игрок ' + me;
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); };
$('#inv').onclick = async () => {
  const u = location.href.split('#')[0] + '#room=' + room;
  try { if (navigator.share) await navigator.share({ title: document.title, url: u }); else { await navigator.clipboard.writeText(u); toast('Ссылка скопирована'); } }
  catch (e) { if (e.name !== 'AbortError') prompt('Скопируйте ссылку:', u); }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cfg = window.FIREBASE_CONFIG || {};
const KEYS = ['body', 'eyes', 'mouth', 'legs', 'acc'];
const LABEL = ['тело', 'глаза', 'рот', 'ноги', 'аксессуар'];
const NAMES = ['Бубля', 'Чпок', 'Хрум', 'Зюзя', 'Мурзик', 'Плюх', 'Квак', 'Бука', 'Ням', 'Тюфяк', 'Пупсик', 'Шмяк'];
const COL = ['#4FB3E8', '#FFA63D', '#7A5BC7', '#6CC24A', '#EF5B5B', '#FF8FC0'];
const SHAPE = ['round', 'tall', 'blob', 'round', 'tall', 'blob'];
const BODYSEL = [[0, 0], [1, 1], [2, 2], [0, 3], [1, 4], [2, 5]];
const INK = '#2B1B3A';
function shade(h, f) { const n = parseInt(h.slice(1), 16); const c = k => Math.max(0, Math.min(255, Math.round(((n >> k) & 255) * f))); return 'rgb(' + c(16) + ',' + c(8) + ',' + c(0) + ')'; }
function bodyShape(k) {
  return k === 'round' ? '<ellipse cx="100" cy="130" rx="64" ry="66"/>'
    : k === 'tall' ? '<rect x="52" y="60" width="96" height="136" rx="46"/>'
    : '<path d="M100 60C150 56 166 110 160 150C156 185 130 198 100 198C68 198 44 184 40 148C36 108 56 64 100 60Z"/>';
}
const eye = (x, y, r, px = 0, py = 0) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x + px}" cy="${y + py}" r="${r * .45}" fill="${INK}"/><circle cx="${x + px - r * .15}" cy="${y + py - r * .18}" r="${r * .14}" fill="#fff"/>`;
const EYES = [
  () => eye(78, 105, 14) + eye(122, 105, 14),
  () => eye(100, 102, 24),
  () => eye(66, 110, 11) + eye(100, 96, 11) + eye(134, 110, 11),
  () => eye(76, 106, 18, 3, 3) + eye(126, 102, 11, -2, -2),
  () => `<path d="M62 104q14 14 28 0M110 104q14 14 28 0" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
  () => eye(78, 108, 13, 3, 2) + eye(122, 108, 13, -3, 2) + `<path d="M58 86L94 98M142 86L106 98" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`
];
const MOUTH = [
  () => `<path d="M68 140Q100 182 132 140Z" fill="#5A1030"/><path d="M78 141h13v10h-13zM109 141h13v10h-13z" fill="#fff"/>`,
  () => `<path d="M70 138Q100 178 130 138Z" fill="#5A1030"/><path d="M89 148q11-5 22 0v15q-11 11-22 0z" fill="#FF6B8B"/>`,
  () => `<path d="M68 142Q100 168 132 142" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M80 150l7 14 7-10zM120 150l-7 14-7-10z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`,
  () => `<ellipse cx="100" cy="152" rx="30" ry="24" fill="#5A1030"/><ellipse cx="100" cy="165" rx="16" ry="8" fill="#FF6B8B"/><path d="M80 134h40v9q-20 4-40 0z" fill="#fff"/>`,
  () => `<path d="M64 140H136Q132 170 100 170Q68 170 64 140Z" fill="#5A1030"/><path d="M66 140L74 156L82 140L90 156L98 140L106 156L114 140L122 156L130 140Z" fill="#fff"/>`,
  () => `<ellipse cx="100" cy="152" rx="10" ry="12" fill="#5A1030"/>`
];
const rr = (x, y, w, h, c, r = 9) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c}"/>`;
const LEGS = [
  c => rr(70, 184, 20, 32, c) + rr(110, 184, 20, 32, c) + `<ellipse cx="76" cy="218" rx="17" ry="8" fill="${c}"/><ellipse cx="124" cy="218" rx="17" ry="8" fill="${c}"/>`,
  c => [58, 82, 106, 130].map(x => rr(x - 2, 186, 16, 30, c, 7)).join(''),
  c => [74, 100, 126].map((x, i) => `<path d="M${x} 188q${i % 2 ? 12 : -12} 14 0 26t0 20" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round"/>`).join(''),
  c => rr(88, 186, 24, 30, c, 8) + `<ellipse cx="100" cy="220" rx="32" ry="10" fill="${c}"/>`,
  c => [78, 122].map(x => `<path d="M${x} 190l-9 6 18 6-18 6 18 6-18 6 9 5" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`).join('') + `<ellipse cx="78" cy="232" rx="14" ry="5" fill="${c}"/><ellipse cx="122" cy="232" rx="14" ry="5" fill="${c}"/>`,
  c => rr(74, 188, 14, 20, c, 6) + rr(112, 188, 14, 20, c, 6) + `<ellipse cx="72" cy="214" rx="24" ry="11" fill="${c}"/><ellipse cx="128" cy="214" rx="24" ry="11" fill="${c}"/>`
];
const ACC = [
  { back: 1, f: () => `<path d="M60 80Q40 52 56 28Q72 52 82 70Z" fill="#F5D76E" stroke="#D9A93A" stroke-width="2"/><path d="M140 80Q160 52 144 28Q128 52 118 70Z" fill="#F5D76E" stroke="#D9A93A" stroke-width="2"/>` },
  { back: 1, f: () => `<path d="M82 70L66 36M118 70L134 36" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><circle cx="66" cy="32" r="8" fill="#FF5C8A"/><circle cx="134" cy="32" r="8" fill="#FF5C8A"/>` },
  { f: () => `<path d="M70 68L72 38L86 54L100 32L114 54L128 38L130 68Z" fill="#F6C453" stroke="#D79A1E" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="56" r="4.5" fill="#E8548C"/><circle cx="82" cy="60" r="3" fill="#4FB3E8"/><circle cx="118" cy="60" r="3" fill="#4FB3E8"/>` },
  { f: () => rr(78, 22, 44, 40, '#3A2A5A', 4) + rr(78, 46, 44, 8, '#E8548C', 0) + `<ellipse cx="100" cy="62" rx="42" ry="8" fill="#3A2A5A"/>` },
  { f: () => `<path d="M128 64L104 50V78zM128 64L152 50V78z" fill="#FF4F8B" stroke="#C2185B" stroke-width="2" stroke-linejoin="round"/><circle cx="128" cy="64" r="8" fill="#FF8FB5" stroke="#C2185B" stroke-width="2"/>` },
  { back: 1, f: (c) => `<path d="M62 84L70 46L84 70L94 40L106 70L116 40L130 70L138 46L142 84Z" fill="${c}"/>` }
];
function monster(sel) {
  const has = k => sel[k] !== undefined && sel[k] !== null;
  if (!has('body')) return `<ellipse cx="100" cy="130" rx="62" ry="64" fill="none" stroke="rgba(142,15,69,.35)" stroke-width="3" stroke-dasharray="8 8"/><text x="100" y="152" text-anchor="middle" font-size="64" font-weight="700" fill="rgba(142,15,69,.35)">?</text>`;
  const [sh, ci] = BODYSEL[sel.body], c = COL[ci], d = shade(c, .78);
  let o = '';
  if (has('acc') && ACC[sel.acc].back) o += ACC[sel.acc].f(d);
  if (has('legs')) o += LEGS[sel.legs](d);
  o += `<g fill="${c}" stroke="${shade(c, .7)}" stroke-width="3">${bodyShape(SHAPE[sel.body])}</g>`;
  o += `<ellipse cx="100" cy="162" rx="36" ry="30" fill="#fff" opacity=".2"/>`;
  if (has('eyes')) o += EYES[sel.eyes]();
  if (has('mouth')) o += MOUTH[sel.mouth]();
  if (has('acc') && !ACC[sel.acc].back) o += ACC[sel.acc].f(d);
  return o;
}
const svg = (sel, vb) => `<svg viewBox="${vb || '0 6 200 236'}" xmlns="http://www.w3.org/2000/svg">${monster(sel)}</svg>`;
const CROP = ['0 30 200 190', '30 66 140 84', '40 112 120 80', '10 150 180 92', '10 6 180 96'];
if (!window.firebase || !/^https:\/\//.test(cfg.databaseURL || '')) {
  ui.innerHTML = '<div class="mid"><h1>Нет связи</h1><p class="hint">Заполните firebase-config.js и откройте игру через интернет.</p></div>';
} else {
  firebase.initializeApp(cfg);
  const ref = firebase.database().ref('rooms/' + room + '/monster');
  let S = null, prevStep = -1, prevId = 0;
  const fresh = () => ({ id: Date.now(), phase: 'play', step: 0, name: NAMES[Math.floor(Math.random() * NAMES.length)] });
  const picker = st => st % 2 === 0 ? 1 : 2;
  function render() {
    const st = S.step || 0, sel = S.sel || {}, done = S.phase === 'done';
    const mine = !done && picker(st) === me;
    const hop = S.id === prevId && st !== prevStep && prevStep >= 0;
    prevStep = st; prevId = S.id;
    const dots = KEYS.map((_, i) => `<i class="${i < st ? 'on' : i === st && !done ? 'now' : ''}"></i>`).join('');
    const status = done ? 'Монстр готов!' : mine ? `Ваш ход: выберите ${LABEL[st]}` : `Игрок ${picker(st)} выбирает ${LABEL[st]}…`;
    let opts = '';
    if (!done) {
      for (let i = 0; i < 6; i++) opts += `<button class="opt" data-act="pick" data-i="${i}" data-st="${st}" ${mine ? '' : 'disabled'} aria-label="${LABEL[st]} ${i + 1}">${svg({ ...sel, [KEYS[st]]: i }, CROP[st])}</button>`;
    }
    let ov = '';
    if (done) ov = `<div class="over"><div class="card"><div class="mname">Знакомьтесь: ${esc(S.name || 'Монстр')}!</div><div style="height:min(34dvh,260px)">${svg(sel).replace('<svg ', '<svg style="width:100%;height:100%" class="bob" ')}</div><button class="again" data-act="save">Сохранить картинку</button><button class="save" data-act="again">Создать ещё</button><a href="index.html">На главную</a></div></div>`;
    ui.innerHTML = `<div class="steps">${dots}</div><p class="mturn">${status}</p><svg class="stage ${hop ? 'hop' : 'bob'}" viewBox="0 6 200 236" xmlns="http://www.w3.org/2000/svg">${monster(sel)}</svg>${done ? '' : `<div class="opts">${opts}</div><p class="hint">Игроки выбирают по очереди: тело, глаза, рот, ноги и аксессуар.</p>`}${ov}`;
  }
  ref.on('value', s => { S = s.val(); if (!S) { ref.transaction(x => x || fresh()); return; } render(); });
  function pick(i, st) {
    ref.transaction(s => {
      if (!s || s.phase !== 'play' || (s.step || 0) !== st || picker(st) !== me) return;
      const t = { ...s, sel: { ...(s.sel || {}), [KEYS[st]]: i }, step: st + 1 };
      if (st + 1 >= KEYS.length) t.phase = 'done';
      return t;
    });
  }
  async function saveImg() {
    const name = S.name || 'Монстр', W = 800, H = 944;
    try {
      const img = new Image();
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(S.sel || {})); });
      const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(img, 0, 0, W, H);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const file = new File([blob], 'monster.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Картинка сохранена');
    } catch (e) { toast('Не удалось сохранить'); }
  }
  view.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return; const a = b.dataset.act;
    if (a === 'pick') pick(+b.dataset.i, +b.dataset.st);
    else if (a === 'save') saveImg();
    else if (a === 'again') ref.set(fresh());
  };
}
</script>
