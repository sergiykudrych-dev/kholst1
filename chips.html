<style>html{background:#FFE9F0}
:root{--ink:#4A1236;--rose:#C2185B;--deep:#8E0F45;--mute:#8A5570}
*{box-sizing:border-box;margin:0}
body{display:flex;flex-direction:column;min-height:100dvh;font:500 16px/1.4 Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#FFEAF1,#FFC9DC 55%,#F8A9C9) fixed;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px;max-width:520px;width:100%;margin:0 auto}
.chip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-weight:700;font-size:14px;color:var(--deep);text-decoration:none}
#view{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px;margin:0 auto;padding:0 10px max(12px,env(safe-area-inset-bottom))}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;width:100%;text-align:center}
h1{font:400 clamp(34px,10vw,48px)/1.1 'Marck Script',cursive;color:var(--deep)}
.pick{display:grid;gap:12px;width:100%}
.pick button{padding:20px;border-radius:24px;background:rgba(255,255,255,.82);box-shadow:0 14px 34px -18px rgba(142,15,69,.6);font-size:22px;font-weight:700}
.pick small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.beat{font-size:64px;color:var(--rose);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.who,.hint{color:var(--mute);font-size:14px}
.disp{display:grid;place-items:center;min-height:78px;font:700 clamp(52px,16vw,72px)/1 Manrope,sans-serif;color:var(--deep);letter-spacing:2px}
.disp.empty{color:rgba(142,15,69,.25)}
.range{width:100%;text-align:center;padding-top:6px}
.bar{position:relative;height:10px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--rose)}
.hist{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.try{display:flex;gap:12px;align-items:center;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.82);font-weight:700;color:var(--deep)}
.try span{font-weight:500;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.pad button{height:54px;border-radius:14px;background:rgba(255,255,255,.9);color:var(--deep);font-weight:700;font-size:24px;box-shadow:0 2px 0 rgba(142,15,69,.2)}
.start,.again{width:100%;max-width:340px;padding:15px;border-radius:16px;background:var(--rose);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.start:disabled{opacity:.4;cursor:default}
.over{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(74,18,54,.45);backdrop-filter:blur(3px)}
.card{width:100%;max-width:400px;padding:28px 22px 22px;border-radius:28px;background:#FFF8FA;text-align:center;box-shadow:0 30px 70px -20px rgba(74,18,54,.6)}
.card h2{font:400 42px/1.1 'Marck Script',cursive;color:var(--deep)}
.big{margin:10px 0 14px;font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);word-break:break-word}
.card a{display:inline-block;margin-top:12px;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.beat{animation:none}}
.cols{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;min-height:0}
.col h3{font-size:13px;color:var(--mute);font-weight:700}
.col .try{width:100%;justify-content:space-between;padding:6px 14px;font-size:15px}
.turn{font-weight:700;color:var(--deep);text-align:center}
.mine{margin:6px auto 0;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;color:var(--mute)}
.pad button:disabled{opacity:.4;cursor:default}
html,body,button,input,a{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#view,.mid{min-height:0}
.range,.mine,.disp,.pad,.start{flex-shrink:0}
.cols{grid-template-rows:minmax(0,1fr);min-height:72px}
.disp{min-height:clamp(48px,9dvh,78px);font-size:clamp(40px,8dvh,72px)}
.pad button{height:clamp(42px,6.5dvh,54px)}
.start{margin-top:8px}
#sceneBox{width:100%;height:min(40vh,calc((min(100vw,520px) - 20px)*.867));height:min(40dvh,calc((min(100vw,520px) - 20px)*.867));flex-shrink:0;margin-top:2px}
#sceneBox[hidden]{display:none}
#scene{display:block;width:100%;height:100%}
.die .q{grid-area:1/1/4/4;display:grid;place-items:center;font:700 44px Manrope,sans-serif;color:#E7B1C6}
#ui{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
textarea{width:100%;padding:12px 14px;border:1.5px solid #F3B6CC;border-radius:14px;background:#fff;font:600 16px Manrope,sans-serif;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--deep);font-size:13px;font-weight:700}
.dierow{display:flex;align-items:center;gap:14px;justify-content:center;min-height:96px}
.die{width:84px;height:84px;padding:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);border-radius:20px;background:#fff;box-shadow:0 8px 20px -10px rgba(142,15,69,.6),0 3px 0 rgba(142,15,69,.2)}
.die i{display:block}.die i.p{margin:2px;border-radius:50%;background:var(--rose)}
.die.roll{animation:roll .6s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}60%{transform:rotate(25deg) scale(1.1)}100%{transform:none}}
.turn{font-weight:700;color:var(--deep);font-size:18px}
.task{margin:10px 0 16px;font-weight:700;font-size:22px;color:var(--deep);word-break:break-word}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;flex-shrink:0}
.fields h3{margin-bottom:6px;text-align:center;font-size:13px;color:var(--mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;border-radius:20px;background:rgba(255,255,255,.55)}
.grid.big{width:100%;max-width:320px;gap:8px;padding:14px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:14px}
button.cell:disabled{cursor:default}
.cell .c{width:82%;height:64%;border-radius:55% 45% 60% 40%/60% 50% 50% 40%;background:radial-gradient(ellipse at 35% 30%,#FFF1BE,#F6C453 70%,#E3A62C);box-shadow:0 3px 0 rgba(160,110,20,.35);transform:rotate(-12deg);transition:transform .15s}
.cell:nth-child(3n+2) .c{transform:rotate(8deg)}.cell:nth-child(3n) .c{transform:rotate(-30deg)}
button.cell:not(:disabled):active .c{transform:scale(.88)}
.cell.sel{background:rgba(194,24,91,.16);box-shadow:inset 0 0 0 2px var(--rose)}
.cell .b{position:absolute;top:0;right:2px;font-size:15px}
.cell .em{font-size:clamp(24px,8vw,34px)}
.cell .dot{width:10px;height:10px;border-radius:50%;background:rgba(142,15,69,.2)}
.big2{font-size:64px;line-height:1.1}
.task{margin:10px 0 16px;font-weight:700;font-size:22px;color:var(--deep);word-break:break-word}
.board4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;width:100%;max-width:min(380px,52dvh);border-radius:22px;background:rgba(255,255,255,.55);flex-shrink:0}
.board4 .cell .em{font-size:clamp(30px,11vw,46px)}
.board4 .cell .b{top:2px;right:6px;font-size:20px}
.board4.b3{grid-template-columns:repeat(3,1fr);max-width:min(300px,36dvh);gap:8px}
.board4.b3.sm{max-width:min(150px,17dvh);gap:4px;padding:8px;border-radius:16px}
.board4.b3.sm .cell .em{font-size:20px}.board4.b3.sm .cell .b{font-size:14px;top:0;right:3px}
.cap{font-weight:800;font-size:14px;color:var(--mute);text-align:center}
</style>

<body>
<header>
  <a class="chip" href="index.html" aria-label="Игры">←<span class="bk"> Игры</span></a>
  <span class="chip" id="me"></span>
  <button class="chip" id="inv">Пригласить</button>
</header>
<div id="view"><div id="ui"></div></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="analytics.js"></script>
<script src="profile.js"></script>
<script src="fx.js"></script>
<script src="gamekit.js?v=1"></script>
<script src="ads.js" data-mode="game"></script>
<script>
document.addEventListener('gesturestart', e => e.preventDefault());
const $ = s => document.querySelector(s), view = $('#view'), ui = $('#ui');
const room = (location.hash.match(/room=([\w-]+)/) || [])[1];
if (!room) location.replace('index.html');
const me = /host=1/.test(location.hash) ? 1 : 2, other = 3 - me;
$('#me').textContent = 'Вы — Игрок ' + me;
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); };
$('#inv').onclick = async () => {
  const u = location.href.split('#')[0] + '#room=' + room;
  try { if (navigator.share) await navigator.share({ title: document.title, url: u }); else { await navigator.clipboard.writeText(u); toast('Ссылка скопирована'); } }
  catch (e) { if (e.name !== 'AbortError') prompt('Скопируйте ссылку:', u); }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cfg = window.FIREBASE_CONFIG || {};
const EMO = ['🎅', '🎭', '🎁', '💋', '🌹'];
if (!window.firebase || !/^https:\/\//.test(cfg.databaseURL || '')) {
  ui.innerHTML = '<div class="mid"><h1>Нет связи</h1><p class="hint">Заполните firebase-config.js и откройте игру через интернет.</p></div>';
} else {
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  Profile.start(room, me, () => { if (S) render(); });
  Kit.attach();
  Profile.track('chips', S => S.phase === 'over' ? (S.win ? (S.win === me ? 'win' : 'loss') : 'draw') : null);
  const ref = firebase.database().ref('rooms/' + room + '/chips16');
  let S = { phase: 'mode' }, pickI = -1, prevP = '';
  const MODE = () => S.mode === 3 ? 3 : 4, NC = m => m === 3 ? 9 : 16;
  const key = (o, i) => (MODE() === 3 ? o + '_' : '') + 'c' + i;
  const cellsOf = (m) => [...Array(NC(m)).keys()];
  const cellHtml = (r, extra) => r !== undefined ? `<div class="cell">${r ? `<span class="em">${r.e}</span>` : '<span class="dot"></span>'}</div>` : extra;
  /* поле для выбора своего места */
  function setupBoard() {
    return cellsOf(MODE()).map(i => `<button class="cell ${pickI === i ? 'sel' : ''}" data-act="sel" data-i="${i}" aria-label="Чипс ${i + 1}"><span class="c"></span>${pickI === i ? '<small class="b">♥&#xFE0E;</small>' : ''}</button>`).join('');
  }
  /* режим 4×4: общее поле; режим 3×3: owner — чьё поле */
  function playBoard(owner, clickable) {
    const rv = S.rv || {}, my = S['h' + me];
    return cellsOf(MODE()).map(i => {
      const k = key(owner, i), badge = owner === me && my && my.c === 'c' + i && (MODE() === 3 || true) ? `<small class="b">${my.e}</small>` : '';
      return cellHtml(rv[k], clickable ? `<button class="cell" data-act="pick" data-i="${i}" aria-label="Чипс ${i + 1}"><span class="c"></span>${badge}</button>` : `<div class="cell"><span class="c"></span>${badge}</div>`);
    }).join('');
  }
  const cls3 = 'board4 b3';
  function render() {
    const p = S.phase;
    if (p !== prevP) { if (p === 'setup') pickI = -1; prevP = p; }
    const m = MODE(), boardCls = m === 3 ? 'board4 b3' : 'board4';
    if (p === 'mode') {
      const chipsSvg = (x, y, n, s) => { let o = ''; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) o += `<ellipse cx="${x + j * s}" cy="${y + i * s}" rx="${s * .36}" ry="${s * .28}" fill="#F6C453" transform="rotate(-12 ${x + j * s} ${y + i * s})"/>`; return o; };
      const m4 = `<svg viewBox="0 0 120 120">${chipsSvg(21, 21, 4, 26)}<text x="73" y="78" font-size="22" text-anchor="middle">🎁</text></svg>`;
      const m3 = `<svg viewBox="0 0 120 120"><rect x="4" y="34" width="52" height="52" rx="10" fill="#fff" opacity=".6"/><rect x="64" y="34" width="52" height="52" rx="10" fill="#fff" opacity=".6"/>${chipsSvg(15, 45, 3, 15)}${chipsSvg(75, 45, 3, 15)}<text x="30" y="27" font-size="16" text-anchor="middle">🐻</text><text x="90" y="27" font-size="16" text-anchor="middle">🐰</text><text x="90" y="112" font-size="16" text-anchor="middle">🎁</text><text x="30" y="112" font-size="16" text-anchor="middle">🎁</text></svg>`;
      ui.innerHTML = `<div class="mid"><h1>Фишки</h1><p class="hint">Выберите поле</p><div class="k-modes">
        <button class="k-mode" data-act="mode" data-m="4"><span class="mini">${m4}</span><b>Общее поле</b><small>4×4, одно на двоих</small></button>
        <button class="k-mode" data-act="mode" data-m="3"><span class="mini">${m3}</span><b>Два поля</b><small>3×3, у каждого своё</small></button></div></div>`;
    } else if (p === 'setup' && !S['h' + me]) {
      ui.innerHTML = `<div class="mid"><h1>Спрячьте сюрприз</h1><p class="hint">${m === 3 ? 'На вашем поле — партнёр будет искать' : 'Потом будете искать сюрприз друг друга'}</p>
        <div class="${boardCls}">${setupBoard()}</div></div><button class="start" data-act="save" ${pickI >= 0 ? '' : 'disabled'}>Готово</button>`;
    } else if (p === 'setup') {
      ui.innerHTML = `<div class="mid"><div class="beat">♥&#xFE0E;</div><h1>Ждём: ${pn(other)}…</h1></div>`;
    } else {
      const myTurn = p === 'play' && S.turn === me;
      const status = p === 'over' ? '' : myTurn ? 'Ваш ход: найдите сюрприз' : `Ходит ${pn(other)}…`;
      const draw = p === 'over' && !S.win;
      const ov = p === 'over' ? `<div class="over"><div class="card"><div class="big2">${draw ? '🤝' : S.we || '🎁'}</div><h2>${draw ? 'Ничья' : S.win === me ? 'Вы победили!' : 'Победил ' + Kit.esc(Kit.nm(S.win))}</h2>
          <button class="again" data-act="again">Играть ещё</button></div></div>` : '';
      const st = status ? `<p class="turn">${status}</p>` : '';
      if (m === 3) {
        ui.innerHTML = `${st}<p class="cap">Поле: ${Kit.esc(Kit.nm(other))}</p><div class="${boardCls}">${playBoard(other, myTurn)}</div>
          <p class="cap">Ваше поле</p><div class="${boardCls} sm">${playBoard(me, false)}</div>${ov}`;
      } else {
        ui.innerHTML = `${st}<div class="${boardCls}">${playBoard(0, myTurn)}</div>${ov}`;
      }
    }
  }
  Profile.on(ref, s => { S = s.val() || { phase: 'mode' }; render(); });
  function pickMode(m) {
    ref.transaction(s => { if (s && s.phase && s.phase !== 'mode') return; return { phase: 'setup', mode: m }; });
  }
  function save() {
    if (pickI < 0) return; const h = { c: 'c' + pickI, e: EMO[Math.floor(Math.random() * EMO.length)] };
    ref.transaction(s => {
      s = { ...(s || { phase: 'setup' }) }; if (s.phase !== 'setup') return;
      s['h' + me] = h;
      if (s.h1 && s.h2) { s.phase = 'play'; s.turn = 1 + Math.floor(Math.random() * 2); s.rv = {}; }
      return s;
    }, () => {});
  }
  function take(i) {
    ref.transaction(s => {
      if (!s || s.phase !== 'play' || s.turn !== me) return;
      const m = s.mode === 3 ? 3 : 4, k = (m === 3 ? other + '_' : '') + 'c' + i, rv = { ...(s.rv || {}) }, theirs = s['h' + other];
      if (rv[k] !== undefined) return;
      const t = { ...s };
      if (theirs && theirs.c === 'c' + i) { rv[k] = { e: theirs.e, o: other }; t.rv = rv; t.phase = 'over'; t.win = me; t.we = theirs.e; }
      else { rv[k] = 0; t.rv = rv; t.turn = other; if (m === 4 && Object.keys(rv).length >= 16) t.phase = 'over'; }
      return t;
    });
  }
  function again() {
    ref.transaction(s => { if (!s || s.phase !== 'over') return; return { phase: 'setup', mode: s.mode === 3 ? 3 : 4 }; });
  }
  view.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return; const a = b.dataset.act, i = +b.dataset.i;
    if (a === 'sel') { pickI = pickI === i ? -1 : i; render(); }
    else if (a === 'save') save();
    else if (a === 'pick') take(i);
    else if (a === 'mode') pickMode(+b.dataset.m);
    else if (a === 'again') again();
  };
}
</script>
