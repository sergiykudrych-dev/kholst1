<style>
:root{--ink:#4A1236;--rose:#C2185B;--deep:#8E0F45;--mute:#8A5570}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;font:500 16px/1.45 Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#FFEAF1,#FFC9DC 55%,#F8A9C9) fixed;overflow-x:hidden}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#hearts span{position:absolute;bottom:-70px;animation:rise linear infinite}
#hearts span:nth-child(3n){color:#E91E63}#hearts span:nth-child(3n+1){color:#FF7FA8}#hearts span:nth-child(3n+2){color:#fff}
@keyframes rise{to{transform:translateY(-125vh) rotate(14deg)}}
main{position:relative;max-width:520px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));display:grid;gap:14px}
h1{font:400 clamp(52px,16vw,84px)/1 'Marck Script',cursive;color:var(--deep);text-align:center}
.lead{text-align:center;color:var(--mute);margin-bottom:12px;font-size:15px}
.game{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;border:0;border-radius:28px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 34px -16px rgba(142,15,69,.55);cursor:pointer;color:inherit;font:inherit;transition:transform .2s}
.game:hover{transform:translateY(-2px)}
.tile{flex:none;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#FF7FA8,#C2185B)}
.game b{display:block;font-size:22px}
.game small{display:block;color:var(--mute);font-size:14px;line-height:1.35}
.go{margin-left:auto;color:var(--rose);font-size:24px}
.toprow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:nowrap;margin:-4px 0 12px}.toprow #who{min-width:0;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who.ic{flex:none;min-width:44px;height:40px;padding:0 12px;font-size:18px;line-height:1}.lead b{color:var(--rose)}
.who{margin:0;padding:9px 16px;border:0;border-radius:999px;background:rgba(255,255,255,.8);color:var(--deep);font:700 14px Manrope,sans-serif;cursor:pointer}
.foot{text-align:center;font-size:12px}.foot a{color:var(--mute)}
.soon{padding:18px;border:2px dashed rgba(194,24,91,.35);border-radius:28px;text-align:center;color:var(--mute);font-size:14px}
dialog{border:0;border-radius:28px;padding:26px 22px 22px;width:min(400px,calc(100vw - 32px));margin:auto;background:#FFF8FA;color:var(--ink);box-shadow:0 30px 70px -20px rgba(74,18,54,.6)}
dialog::backdrop{background:rgba(74,18,54,.45);backdrop-filter:blur(3px)}
dialog h2{font:400 38px/1.1 'Marck Script',cursive;color:var(--deep);text-align:center}
dialog p{text-align:center;color:var(--mute);font-size:14px;margin:8px 0 16px}
.link{width:100%;padding:12px 14px;border:1.5px solid #F3B6CC;border-radius:14px;background:#fff;font:600 14px Manrope,sans-serif;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.btn{padding:12px;border:1.5px solid var(--rose);border-radius:14px;background:none;color:var(--rose);font:700 15px Manrope,sans-serif;cursor:pointer}
.play{width:100%;padding:15px;border:0;border-radius:16px;background:var(--rose);color:#fff;font:700 17px Manrope,sans-serif;cursor:pointer}
.x{position:absolute;top:8px;right:10px;width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#hearts span{animation:none;bottom:auto;top:calc(var(--y)*1%)}.game{transition:none}}
html,body,button,input,a{touch-action:manipulation}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main>
  <h1>Во что сыграем?</h1>
  <p class="lead">Выберите игру <b>→</b> отправьте ссылку <b>→</b> играйте</p>
  <div class="toprow"><button class="who" id="who" type="button"></button><button class="who ic" id="fr" type="button" aria-label="Друзья" title="Друзья">👥</button><button class="who ic" id="st" type="button" aria-label="Статистика" title="Статистика">📊</button></div>
  <button class="game" id="paint">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 30 20"><circle cx="8" cy="11" r="7" fill="#fff"/><rect x="10" y="4" width="12" height="12" rx="2" fill="#fff" fill-opacity=".6"/><path d="M21 18l4.5-9 4.5 9z" fill="#FFE08A"/></svg></span>
    <span><b>Холст</b><small>Рисуйте вместе: рисунок сразу появляется у второго</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="word">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M3 26h10M17 26h10M31 26h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><g font-family="Manrope,sans-serif" font-weight="700" font-size="18" fill="#fff" text-anchor="middle"><text x="8" y="21">А</text><text x="36" y="21">Я</text></g></svg></span>
    <span><b>Угадай слово</b><small>Один загадывает, другой угадывает по буквам</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="num">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><text x="22" y="25" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="28" fill="#fff">?</text></svg></span>
    <span><b>Угадай число</b><small>Оба загадывают число и по очереди угадывают чужое</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="egg">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><ellipse cx="22" cy="15" rx="10" ry="12" fill="#FFE08A"/></svg></span>
    <span><b>Не урони яйцо</b><small>Бросайте кубик по очереди: кто уронит яйцо, выполняет задание</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="chips">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M7 20C9 10 18 5 28 7c7 1 10 6 8 12-3 6-13 7-20 4-5-1-9-2-9-3z" fill="#FFE08A"/></svg></span>
    <span><b>Чипсы-сюрприз</b><small>Каждый прячет один сюрприз среди 16 чипсов</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="ttt">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M6 6l12 18M18 6L6 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="33" cy="15" r="8" stroke="#FFE08A" stroke-width="4" fill="none"/></svg></span>
    <span><b>Крестики-нолики</b><small>3 в ряд или 5 в ряд на выбор</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="memo">
    <span class="tile"><svg width="44" height="30" viewBox="0 0 44 30"><rect x="4" y="4" width="16" height="22" rx="4" fill="#fff"/><rect x="24" y="4" width="16" height="22" rx="4" fill="#FFE08A"/><path d="M12 11c-3-3-6 1-3 4l3 3 3-3c3-3 0-7-3-4z" fill="#C2185B"/></svg></span>
    <span><b>Найди пару</b><small>Открывайте по две карточки и ищите одинаковые</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <button class="game" id="mons">
    <span class="tile"><svg width="40" height="34" viewBox="0 0 40 34"><path d="M10 12L7 3l7 5M30 12l3-9-7 5" fill="#FFD166"/><ellipse cx="20" cy="19" rx="13" ry="13" fill="#6CC24A"/><circle cx="15" cy="16" r="4" fill="#fff"/><circle cx="25" cy="16" r="4" fill="#fff"/><circle cx="15" cy="16" r="1.8" fill="#2B1B3A"/><circle cx="25" cy="16" r="1.8" fill="#2B1B3A"/><path d="M13 23q7 7 14 0z" fill="#5A1030"/></svg></span>
    <span><b>Создай монстра</b><small>По очереди выбирайте глаза, рот, тело, ноги и аксессуары</small></span>
    <span class="go">♥&#xFE0E;</span>
  </button>
  <div class="soon">Скоро здесь появятся новые игры ♥&#xFE0E;</div>
  <p class="foot"><a href="privacy.html">Конфиденциальность</a></p>
</main>

<dialog id="dlg">
  <button class="x" id="x" aria-label="Закрыть">✕</button>
  <h2>Комната для двоих</h2>
  <p>Отправьте ссылку тому, с кем хотите играть, и нажмите «Играть».</p>
  <input class="link" id="link" readonly aria-label="Ссылка на комнату">
  <div class="two"><button class="btn" id="share">Поделиться</button><button class="btn" id="copy">Копировать</button></div>
  <button class="play" id="play">Играть</button>
  <p class="hint" id="hint" hidden>Ссылка заработает, когда сайт будет опубликован в интернете.</p>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="analytics.js"></script>
<script src="profile.js"></script>
<script src="ads.js" data-mode="home"></script>
<script src="stats.js"></script>
<script src="friends.js"></script>
<script>
document.addEventListener('gesturestart', e => e.preventDefault());
const $ = s => document.querySelector(s), dlg = $('#dlg'), link = $('#link');
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span'), y = Math.random() * 90;
  s.textContent = '♥\uFE0E';
  s.style.cssText = `left:${Math.random() * 100}%;font-size:${14 + Math.random() * 34}px;opacity:${.25 + Math.random() * .35};animation-duration:${14 + Math.random() * 16}s;animation-delay:-${Math.random() * 30}s;--y:${y}`;
  $('#hearts').append(s);
}
const showRoom = (page, code) => {
  link.value = new URL(page + '#room=' + code, location.href).href;
  $('#hint').hidden = location.protocol !== 'file:';
  dlg.showModal();
};
const open = page => {
  if (window.Track) Track.event('room_created', { game: page.replace(/\.html$/, '') });
  const code = [...crypto.getRandomValues(new Uint8Array(10))].map(n => 'abcdefghijkmnpqrstuvwxyz23456789'[n % 32]).join('');
  if (window.Friends && Friends.target()) {
    Friends.sendInvite(page, code).then(
      () => { Friends.clearTarget(); location.href = new URL(page + '#room=' + code + '&host=1', location.href).href; },
      () => { Friends.clearTarget(); Friends.toast('Не удалось отправить приглашение, отправьте ссылку вручную'); showRoom(page, code); });
    return;
  }
  showRoom(page, code);
};
$('#paint').onclick = () => open('paint.html');
$('#word').onclick = () => open('word.html');
$('#num').onclick = () => open('number.html');
$('#egg').onclick = () => open('egg.html');
$('#chips').onclick = () => open('chips.html');
$('#ttt').onclick = () => open('tictactoe.html');
$('#memo').onclick = () => open('memory.html');
$('#mons').onclick = () => open('monster.html');
const paintWho = () => { $('#who').textContent = Profile.has() ? (Profile.avatar() + ' ' + Profile.name()).trim() : 'Как вас зовут? ✎'; };
$('#who').onclick = () => Profile.ask().then(paintWho); paintWho();
if (!Profile.has() && !Profile.skipped()) Profile.ask().then(paintWho);
$('#fr').onclick = () => Friends.open();
$('#st').onclick = () => Stats.open();
Friends.init();
$('#x').onclick = () => dlg.close();
dlg.onclick = e => { const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close(); };
link.onclick = () => link.select();
async function copy() {
  try { await navigator.clipboard.writeText(link.value); } catch (_) { link.select(); document.execCommand('copy'); }
  $('#copy').textContent = 'Скопировано'; setTimeout(() => $('#copy').textContent = 'Копировать', 1800);
}
$('#copy').onclick = copy;
$('#share').onclick = async () => {
  if (!navigator.share) return copy();
  try { await navigator.share({ title: 'Холст', text: 'Рисуем вместе', url: link.value }); } catch (_) {}
};
$('#play').onclick = () => { location.href = link.value + '&host=1'; };
</script>
</body>
</html>
